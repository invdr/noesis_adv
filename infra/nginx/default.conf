# nginx для VPS:
#   - публичный лендинг (Astro static) на корне домена
#   - CRM (webapp) на /crm
#   - API бэкенда на /api → контейнер backend:3000
#
# Сейчас сайт открыт по голому IP без домена, поэтому server_name = "_"
# (default-сервер: принимает любой Host, включая обращение по IP). Когда
# появится домен — поменяйте на `server_name noesis-grozny.ru www.noesis-grozny.ru;`.
#
# HTTPS-блок закомментирован: раскомментируйте после выпуска сертификата
# (например, certbot) и положите файлы в infra/certs.

server {
    listen 80 default_server;
    server_name _;

    # Для выпуска/обновления сертификата Let's Encrypt:
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # --- API ---
    # Дефолтный client_max_body_size (1m) сознательно оставлен для остального
    # /api/ — анонимные ручки (POST /api/leads, /api/public/*) большие тела
    # принимать не должны: бэкенд буферизует запрос в память целиком.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Пути с загрузками файлов (за логином CRM): самое крупное тело —
        # сохранение конструкции с галереей (CONSTRUCTION_UPLOAD_MAX_BYTES ≈ 302 МБ). Дефолт
        # 1m рубил бы любую загрузку фото до бэкенда; точные лимиты по типам
        # запросов держит сам бэкенд (bodyLimit + maxRequestBodySize).
        # Осознанный компромисс: nginx не видит авторизацию, поэтому лимит
        # действует и для анонимных POST — бэкенд ответит 401 до чтения тела,
        # но nginx успеет отбуферизовать его на диск. Приемлемо для одного VPS;
        # альтернатива (proxy_request_buffering off) убрала бы буфер, но
        # заставила бы держать соединение с бэкендом на весь аплоад.
        location ~ ^/api/(constructions|developers|news|files)(/|$) {
            client_max_body_size 320m;
            proxy_pass http://backend:3000;
        }
    }

    # --- Загруженные файлы (фото конструкций, документы) ---
    # Раздаются с постоянного тома (тот же, что backend монтирует в FILES_DIR).
    # Имена обезличены; долгий кеш — содержимое по ключу неизменно.
    location /files/ {
        alias /srv/files/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- CRM (webapp, SPA) ---
    location /crm/ {
        alias /srv/webapp/;
        try_files $uri $uri/ /crm/index.html;
    }

    # --- Страницы конструкций и новостей (Astro static) ---
    # Снятая/архивная конструкция или новость → страницы в сборке нет: старый URL
    # 301-редиректим на каталог (решение №3 Вехи 4). Редирект ограничен этими
    # префиксами, чтобы не задеть остальные 404.
    #
    # root — симлинк current на актуальный релиз (Веха 4.2): автосборщик
    # переключает его атомарно, при сбое сборки сайт остаётся на прошлой версии.
    location /constructions/ {
        root /srv/website/current;
        try_files $uri $uri/ $uri.html @stale;
    }
    location /news/ {
        root /srv/website/current;
        try_files $uri $uri/ $uri.html @stale;
    }
    location @stale {
        return 301 /#catalog;
    }

    # --- Лендинг (Astro static) ---
    location / {
        root /srv/website/current;
        try_files $uri $uri/ $uri.html /index.html;
    }
}

