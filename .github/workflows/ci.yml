# CI: гейт качества на каждый push/PR — тот же, что перед деплоем на VPS
# (typecheck + тесты), плюс E2E-смоук CRM с реальной Postgres. Красный CI не
# блокирует деплой технически (деплой ручной), но ловит поломки до прода.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11 # как packageManager в package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run --cwd backend prisma:generate

      - name: Typecheck
        run: bun run typecheck

      - name: Tests (contracts + backend + webapp + website)
        run: bun run test

  e2e:
    name: e2e smoke (CRM)
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: noesis
          POSTGRES_PASSWORD: noesis
          POSTGRES_DB: noesis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noesis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://noesis:noesis@localhost:5432/noesis
      ADMIN_EMAIL: admin@test.local
      ADMIN_PASSWORD: admin-password-1
      # vite preview слушает 4173 — разрешаем его CORS'ом бэкенда.
      CORS_ORIGINS: http://localhost:4173
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run --cwd backend prisma:generate

      - name: Migrate + seed database
        run: |
          bun run --cwd backend prisma:deploy
          bun run --cwd backend db:seed

      - name: Start backend
        run: |
          bun run --cwd backend start > backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/public/site-settings >/dev/null && break
            sleep 1
          done

      - name: Build and serve webapp
        run: |
          VITE_API_URL=http://localhost:3000 bun run --cwd webapp build
          bun run --cwd webapp preview -- --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4173 >/dev/null && break
            sleep 1
          done

      - name: Install Playwright browser
        run: bunx playwright install chromium --with-deps

      - name: Run E2E smoke
        run: bun run e2e

      # Диагностика падения смоука: логи бэкенда/preview (создание заявки бьёт в
      # бэк — при 4xx/5xx причина видна только здесь) не в общем выводе шага.
      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "=== backend.log ==="; cat backend.log || echo "(нет)"
          echo "=== preview.log ==="; cat preview.log || echo "(нет)"
